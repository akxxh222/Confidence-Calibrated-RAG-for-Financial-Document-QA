services:
  db:
    image: ankane/pgvector:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ccrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ccrag}
      POSTGRES_DB: ${POSTGRES_DB:-ccrag}
    ports:
      - "5433:5432"   # host 5433 -> container 5432: native PG17 service occupies host 5432
    volumes:
      - ccrag_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  api:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "5000:5000"
    command: gunicorn -w 2 -b 0.0.0.0:5000 app.api.app:app

volumes:
  ccrag_pgdata:
