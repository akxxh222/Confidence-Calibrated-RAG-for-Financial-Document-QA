name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint (flake8)
        run: flake8 app eval tests --max-line-length=100 --extend-ignore=E203
      - name: Unit tests (pytest)
        run: pytest tests/ -v
        # DATABASE_URL is required at import time (db/connection.py reads it
        # directly); no LLM key is needed because both API clients are
        # constructed lazily and unit tests never call the Gemini API.
        env:
          DATABASE_URL: postgresql://ccrag:ccrag@localhost:5432/ccrag


  docker-build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t cc-rag:ci .

  publish:
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/akxxh222/confidence-calibrated-rag-for-financial-document-qa:latest
